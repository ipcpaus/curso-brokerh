<style>
:root{--paper:#f6f7f9;--ink:#15243a;--brick:#b42a33;--ok:#1e7a4c;--mute:#56647a;--rule:#d9dee6;--card:#ffffff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0e1726;--ink:#e8edf5;--brick:#ff7b82;--ok:#6fd39a;--mute:#9aa8bd;--rule:#2a3a52;--card:#15223a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1726;--ink:#e8edf5;--brick:#ff7b82;--ok:#6fd39a;--mute:#9aa8bd;--rule:#2a3a52;--card:#15223a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.note{border-left:3px solid var(--rule);padding:4px 12px;color:var(--mute);font-size:.92rem;margin:10px 0}

<p class="note">Material de estudio. No sustituye el Reglamento vigente ni el temario oficial de la Asociación.</p>

<script>
const D={"titulo": "Guía de estudio: Reglamento Societario y certificación hipotecaria", "subtitulo": "Basada en el Reglamento Societario v7.0 (mayo 2026) y en la Guía de Estudio cargada. Confirma los temas con el temario oficial antes del examen.", "criterios": "El examen de certificación evalúa tres criterios: procedimental (caso práctico), conceptual (teoría) y ético (Reglamento). La guía de estudio marca como prioritarios los artículos Tercero, Décimo Primero, Décimo Octavo, Vigésimo y Vigésimo Octavo.", "bloques": [{"titulo": "Originación del crédito", "fuente": "Guía de estudio, pp. 5 a 21", "puntos": ["Edad más plazo: la referencia habitual es 74 años con 11 meses, aunque algunas instituciones llegan a 84 años con 11 meses.", "Aforo o LTV: porcentaje máximo del crédito sobre el menor entre el avalúo comercial y el precio pactado en la compraventa.", "Enganche: diferencia entre el valor del inmueble y el crédito; lo liquida el cliente con ahorro previo.", "Mensualidad = capital + interés + seguros + comisiones. El interés se cobra sobre el saldo insoluto.", "La compraventa con crédito implica tres actos: traslado de dominio (con el ISAI, el costo mayor), contrato de crédito y contrato de hipoteca."], "id": 1}, {"titulo": "Productos hipotecarios y cofinanciamiento", "fuente": "Guía de estudio, pp. 22 a 33", "puntos": ["Cofinanciamiento: combina crédito bancario, crédito ONAVIS (INFONAVIT o FOVISSSTE) y saldo de la subcuenta de vivienda.", "Subcuenta de vivienda: ahorro del trabajador que se forma con aportaciones patronales de 5% del salario y se entrega a la firma.", "Crédito ONAVIS: depende del salario y del plazo; se paga con la aportación patronal y un descuento en nómina.", "Crédito bancario: lo determina la institución según la capacidad de pago y el comportamiento en el buró de crédito.", "Recursos disponibles para la compraventa: subcuenta más créditos cofinanciados, menos los descuentos aplicables."], "id": 2}, {"titulo": "Capacidad de pago, avalúo y buró de crédito", "fuente": "Guía de estudio, pp. 34 a 53", "puntos": ["DTI o nivel de endeudamiento: el límite de referencia es de 35% a 40% del ingreso neto mensual.", "El DTI se calcula de forma conjunta con el coacreditado e incluye la mensualidad solicitada, los pagos de otros créditos vigentes y los descuentos de nómina.", "Buró de crédito: cada mes las entidades reportan si el cliente paga puntual o con retraso; con eso evalúan su certidumbre.", "Avalúo: opinión de un experto certificado por la SHF sobre el valor comercial y la vida útil remanente del inmueble.", "Enfoques de valuación: del costo y de capitalización (ingreso)."], "id": 3}, {"titulo": "Marco legal, fiscal, prevención y datos personales", "fuente": "Guía de estudio, pp. 54 a 84", "puntos": ["Autoridades y normas: CNBV (Ley de Instituciones de Crédito y Circular Única de Bancos), SHF, SHCP (Código Fiscal de la Federación) y Tesorería y Catastro de cada entidad.", "Impuestos: los federales se pagan al SAT; los locales se pagan al gobierno de la CDMX o al municipio, y el ISAI varía según la localidad.", "Prevención de lavado de dinero y KYC: se identifica al cliente y, en su caso, al beneficiario controlador; los expedientes se ponen a disposición de la UIF o del SAT.", "Datos personales: los datos financieros y patrimoniales requieren consentimiento expreso; el aviso de privacidad integral debe informar los derechos ARCO.", "Los datos se usan solo para las finalidades del aviso de privacidad y se cancelan cuando dejan de ser necesarios."], "id": 4}, {"titulo": "Reglamento Societario: contexto, definiciones y reglas con el usuario", "fuente": "Reglamento v7.0, caps. I a III (arts. Primero a Séptimo)", "puntos": ["La Asociación Hipotecaria de México S.C. nace por la falta de regulación y la “mala praxis” del sector. Se constituyó por escritura pública 55,242 del 2 de marzo de 2017.", "Socio: persona moral con al menos 6 contratos directos con bancos, $1,800,000,000 de colocación en 12 meses y aprobación del consejo. Asociado: 2 contratos, $500,000,000 y aprobación del consejo.", "El intermediario pide solo la información indispensable, la coteja con fuentes públicas y, si tiene dudas, pide originales o avisa a la institución (art. Segundo).", "Art. Tercero: debe informar todas las opciones crediticias, con sus beneficios, costos y riesgos.", "Art. Sexto: alterar de forma ilícita y dolosa la información para manipular el resultado es violación mayor. Art. Séptimo: prohibida la colusión que cause distorsión de mercado."], "id": 5}, {"titulo": "Reglamento Societario: Master Bróker, certificación, sanciones y quejas", "fuente": "Reglamento v7.0, caps. III a V (arts. Octavo a Quincuagésimo Primero Bis)", "puntos": ["Art. Décimo Primero: el Master Bróker solo puede tener intermediarios certificados o en proceso de certificación.", "Art. Décimo Segundo: un intermediario de recién ingreso espera 12 meses desde su primera certificación para cambiar de Master Bróker; después, 6 meses. El aviso a la Sociedad es por escrito, dentro de 5 días hábiles.", "Arts. Décimo Tercero y Décimo Sexto: se pueden dar de alta nuevos asesores solo si el Master Bróker tiene al menos 85% certificados; la estructura debe tener 100% certificados.", "Art. Décimo Octavo: certificación en dos etapas (alta y examen de la Dirección General), con vigencia de dos años. Carátulas comodín: máximo 15 por asesor en proceso (art. Décimo Octavo Bis).", "Art. Vigésimo: la cuota de certificación la paga el solicitante y no se reembolsa si falta a la cita sin causa justificada.", "Arts. Vigésimo Octavo y Trigésimo: catálogo de 20 conductas de mala praxis; sanciones de suspensión temporal o pérdida definitiva. La falsificación de documentos implica pérdida definitiva.", "Quejas: prescriben seis meses después de que el quejoso conoce el hecho, salvo delitos o conductas de efecto continuo; los plazos se cuentan en días hábiles. La información confidencial no puede copiarse ni divulgarse."], "id": 6}, {"titulo": "Tabla completa de sanciones", "fuente": "Reglamento v7.0, arts. Vigésimo Octavo y Trigésimo (tabla completa)", "puntos": ["1. Falsificación o alteración de documentos: pérdida definitiva de la certificación.", "2. Falta de verificación de documentos: 1 expediente, suspensión mínima de 12 meses; 2 expedientes, mínimo 24 meses; 3 o más, pérdida definitiva.", "3. Cobro de servicios de intermediación hipotecaria: pérdida definitiva.", "4. Ofrecimiento de pagos por atracción de usuarios: pérdida definitiva.", "5. Gestión de expedientes con conflicto de interés: pérdida definitiva.", "6. Robo de identidad del usuario: pérdida definitiva.", "7a. Falsificación de la firma del usuario en documentos del expediente: pérdida definitiva.", "7b. Uso de firma no autógrafa del usuario: primera vez, 60 días de bloqueo para generar carátulas; reincidencia, pérdida definitiva.", "8. Utilización ilegal o ilícita de datos personales del usuario: pérdida definitiva.", "9. Generar carátulas a nombre de otro intermediario, o usar carátulas ajenas: primera vez, 60 días de bloqueo; reincidencia, pérdida definitiva.", "10. Generar carátulas a nombre de un intermediario que perdió la certificación: pérdida definitiva.", "11. Falta de verificación ocular del usuario antes de ingresar el expediente al banco: primera vez, 60 días de bloqueo; reincidencia, pérdida definitiva.", "12. Falta de emisión o revisión del reporte de domicilio, elaboración por tercero o falsedad: primera vez, impago de la comisión; reincidencia, impago de la comisión.", "13. Sustituir la hipoteca de propios acreditados antes de 1 año de vigencia: primera vez, devolución de la comisión; reincidencia, pérdida definitiva.", "14. Ofrecer al usuario un beneficio adicional, en dinero o en especie, superior a $1,000.00: primera vez, 60 días de bloqueo; reincidencia, pérdida definitiva.", "15. Publicidad engañosa para captar usuarios o contratar asesores: primera vez, 60 días de bloqueo; reincidencia, pérdida definitiva.", "16. Mora temprana por irregularidades en la originación o gestión del crédito: pérdida definitiva.", "17. Inconsistencias generalizadas en una oficina o franquicia: al asesor, la sanción de la mala práctica ejecutada; a la oficina, primera vez suspensión de operaciones por 30 días, y en reincidencia suspensión definitiva.", "18. Falta de ética durante el examen de certificación o renovación: cancelación definitiva del proceso.", "19. Actos inmorales o ilegales que impliquen conspiración contra el sector: lo decide el Comité de Cumplimiento.", "20. Cualquier otra conducta nociva y reprobable a juicio del Comité: lo decide el Comité de Cumplimiento.", "Reincidencia: repetir la mala práctica con el mismo usuario o con otro, de forma subsecuente.", "Inconsistencia generalizada: colusión de asesores o repetición del mismo modus operandi en una oficina, con tres o más malas prácticas, o una misma más de dos veces en 18 meses. Se sanciona a la oficina y a los asesores involucrados.", "Asesor con pérdida definitiva: queda impedido para laborar en cualquier puesto de la estructura del Master Bróker, incluidas oficinas y franquicias.", "Quién sanciona: el Comité de Cumplimiento, con suspensión temporal o pérdida definitiva de la certificación (art. Trigésimo). Las conductas se sancionan a quien las comete o las consiente, y se catalogan como graves, intermedias o bajas, sin perjuicio de las implicaciones penales (art. Vigésimo Noveno)."], "id": 7}, {"titulo": "Caso práctico: expediente de compraventa", "fuente": "Parte procedimental del examen (Guía de estudio) y Reglamento, arts. Décimo Tercero, Décimo Cuarto, Décimo Octavo Bis y Vigésimo Sexto", "puntos": ["Caso ficticio: Ana compra una vivienda de $2,400,000 (precio pactado). El avalúo comercial es de $2,200,000. El banco financia hasta 80% del menor de los dos valores. Su ingreso bruto mensual es de $60,000 y sus pagos mínimos actuales suman $5,000. El FPM del crédito es de $10.00 por cada $1,000.", "Tarea 1: calcula el monto máximo del crédito.", "Tarea 2: calcula el enganche que Ana debe cubrir.", "Tarea 3: calcula la mensualidad y el DTI, y compáralo con el rango de referencia de 35% a 40%.", "Tarea 4: el expediente del asesor Carlos incluye una constancia de situación fiscal emitida hace 8 meses. El reporte de domicilio de Ana no tiene geolocalización y la carátula de operación no incluye el municipio. Indica qué incumple cada caso y qué consecuencia tiene.", "Tarea 5: si Carlos ya usó sus 15 carátulas comodín, ¿puede seguir intermediando mientras no se certifique?"], "solucion": ["Tarea 1: 80% de $2,200,000 = $1,760,000. El aforo se aplica al menor de los dos valores.", "Tarea 2: $2,400,000 menos $1,760,000 = $640,000 de enganche.", "Tarea 3: mensualidad = $1,760,000 entre 1,000, por $10.00 = $17,600. DTI = ($5,000 más $17,600) entre $60,000 = 37.7%, dentro del rango de 35% a 40%.", "Tarea 4: (a) Art. Décimo Tercero: la constancia de situación fiscal debe tener menos de 6 meses; el expediente queda incompleto y no puede avanzar a certificación (art. Décimo Cuarto). (b) Un reporte de domicilio sin geolocalización es inválido, porque le falta un requisito. Si el caso es falta de emisión o de revisión, la primera sanción es el impago de la comisión (fila 12 de la tabla). (c) Una carátula sin municipio es inválida y es motivo de sanción (art. Vigésimo Sexto).", "Tarea 5: no. Al agotar las 15 carátulas comodín, no puede seguir trabajando en intermediación hasta terminar favorablemente su certificación (art. Décimo Octavo Bis)."], "id": 8}, {"titulo": "Reglamento: Master Bróker, altas, CRM, quejas, confidencialidad y fundamentos", "fuente": "Reglamento v7.0, arts. Octavo a Décimo Noveno, Vigésimo Primero a Vigésimo Quinto, Trigésimo Primero a Cuadragésimo Noveno, Quincuagésimo Primero Bis, caps. V y VI", "puntos": ["Master Bróker (arts. Octavo a Décimo): fomentar prácticas de sano desarrollo, entregar información a la Asociación en investigaciones, difundir las obligaciones dentro de su estructura y mantener controles internos.", "Altas de oficinas y franquicias (arts. Décimo Tercero Bis y Décimo Quinto): las da de alta el Master Bróker con documentos fiscales y revisa su situación fiscal conforme a los arts. 69 y 69 bis del Código Fiscal de la Federación. Está prohibida la atracción indebida de talento, como la publicidad engañosa.", "Baja de un intermediario por el Master Bróker (art. Décimo Quinto Bis): aviso por escrito a la Sociedad en 5 días naturales. Si la causa es una mala práctica, debe iniciar el procedimiento de queja.", "Mesas de control (art. Décimo Octavo Ter): las operan asesores certificados y dados de alta, forman parte del Corporativo y su responsable no puede gestionar clientes propios con carátulas de la mesa. El Master Bróker notifica a la Asociación el nombre del responsable en 5 días hábiles.", "Conflicto de interés (art. Décimo Noveno): la Dirección General niega, suspende o cancela la certificación de quien labore activamente en bancos, notarías, unidades de valuación, desarrolladoras, constructoras o inmobiliarias. Quien haya trabajado en una institución financiera debe esperar 3 meses para conservar su certificación.", "CRM (arts. Vigésimo Primero a Vigésimo Quinto): base de datos que administra la Dirección General, con la ficha de asesores y oficinas. Las oficinas inactivas o suspendidas no pueden generar operaciones ni adscribir asesores. El cambio de Master Bróker lo pide el intermediario a la Dirección General, que lo registra y lo notifica por correo; los expedientes iniciados no se llevan consigo.", "Quejas (arts. Trigésimo Primero a Cuadragésimo Noveno): el escrito incluye la petición, el nombre y domicilio del acusado, los hechos bajo protesta de decir verdad y las pruebas, cuya omisión provoca inadmisión. Los plazos se cuentan en días hábiles. El acusado tiene de 3 a 10 días para contestar. Las audiencias son a puerta cerrada, presididas por el Director General, y la resolución final se toma por mayoría de votos del Comité.", "Restitución (art. Quincuagésimo Primero Bis): el Master Bróker puede pedir que se restituya la certificación de un asesor sancionado. Debe haber transcurrido un año desde la resolución, con máximo una solicitud al año, y la Junta de Socios la decide por mayoría simple.", "Confidencialidad (arts. Quincuagésimo Segundo a Quincuagésimo Séptimo): toda la información que entregan bancos y Master Bróker se considera confidencial, y el titular conserva sus derechos. Está prohibido copiarla, transferirla o divulgarla. Sin autorización expresa, debe borrarse. No es confidencial lo que sea del dominio público, lo evidente para un técnico, o lo que deba divulgarse por ley u orden judicial.", "Fundamentos legales (cap. VI): Código Civil Federal (mandato, arts. 2546 a 2574), Código de Comercio (comisión mercantil, arts. 273 a 291), Ley de Protección y Defensa al Usuario de Servicios Financieros (arts. 1 y 3) y Ley Federal de Protección de Datos Personales en Posesión de los Particulares (arts. 1, 6, 7, 8, 11 y 12)."], "id": 9}, {"titulo": "Perfilamiento del cliente y expediente del solicitante", "fuente": "Guía de estudio, pp. 5 a 13", "puntos": ["Ingresos comprobables: base de cálculo del crédito; son los ingresos del cliente que pueden demostrarse.", "Deudas actuales: compromisos bancarios con pagos mínimos, como tarjetas o préstamos.", "Relación de endeudamiento: compara el ingreso mensual con la deuda que se contrae más los pagos mínimos existentes.", "Relación pago-ingresos: porcentaje que representa el pago del crédito solicitado frente al ingreso consolidado. La capacidad de pago mensual es el máximo que la persona puede cubrir cada mes.", "Expediente del solicitante: identidad (INE/IFE, pasaporte o acta de nacimiento), residencia (comprobante de luz, teléfono, agua o TV de paga), estado civil (acta de matrimonio o divorcio), estatus fiscal (cédula de identificación fiscal) y CURP."], "id": 10}, {"titulo": "Finanzas básicas: interés, amortización y CAT", "fuente": "Guía de estudio, pp. 28 a 33", "puntos": ["Interés simple: I = C × i × t (capital inicial, tasa y tiempo). En hipotecas, el tiempo suele contarse en periodos de 30 días, sobre una base de 360 días al año.", "Interés compuesto: al vencer cada periodo, el interés se suma al capital y genera nuevos intereses. El tiempo aparece como exponente: CF = CI × (1 + i)^t.", "Pago fijo (sistema francés): cuotas iguales durante todo el crédito. Al principio la mayor parte va a intereses y después a capital. Da certidumbre, pero la línea de crédito es menor.", "Pagos crecientes: pagos iniciales bajos que aumentan periódicamente. Da mayor línea de crédito y conviene a personas con ingreso creciente, pero el total de intereses es mayor.", "CAT (costo anual total): indicador para comparar créditos. Integra la tasa de interés y todos los costos del crédito, como seguros, comisiones y cuotas."], "id": 11}, {"titulo": "Avalúos: enfoques de valuación", "fuente": "Guía de estudio, pp. 34 a 47", "puntos": ["Método del costo (directo): el valor depende de lo que costaría reponer un bien sustituto de características semejantes. Se basa en el principio de sustitución.", "Método del ingreso o de capitalización: el valor es el valor presente de los ingresos y beneficios futuros que produce el bien durante su vida útil.", "El método del ingreso analiza la capacidad del bien para producir utilidades, según el riesgo de la inversión frente a otras alternativas.", "El avalúo es una fotografía del valor en un momento específico, y el banco lo usa para aplicar sus políticas de crédito.", "Para avalúos de INFONAVIT se requiere un dictamen técnico de calidad."], "id": 12}, {"titulo": "Expediente del inmueble, avalúo y trámites notariales", "fuente": "Guía de estudio, pp. 14 a 21 y 54 a 57", "puntos": ["Inmueble: boleta predial, boleta de agua, planos, régimen de condominio (inscrito en el Registro Público), tablas de indivisos, medidas y colindancias, número oficial y aviso de terminación de obra.", "Avalúo: solicitud en el formato del banco, pago del avalúo, asignación de unidad valuadora y revisión. La confirmación es el Vo.Bo. del banco, con sellos.", "Vendedor: identificación, acta de matrimonio o sentencia de divorcio, escritura original, estado de cuenta, documentos para la exención de ISAI y contrato de compraventa.", "Notaría: el certificado de libertad de gravamen (CLG) muestra si el inmueble tiene gravámenes. También se piden constancias de no adeudo de agua, predial y mantenimiento.", "Al firmar, el notario presenta el aviso preventivo al Registro Público, paga los impuestos locales de adquisición y, en su caso, los federales. Informa a la autoridad fiscal federal, presenta el aviso en materia de PLD y expide los testimonios.", "Principios registrales: publicidad, inscripción, especialidad, fe pública registral, legitimación, consentimiento, tracto sucesivo, rogación, prelación y legalidad."], "id": 13}, {"titulo": "Tipos de avalúo y marco normativo", "fuente": "Guía de estudio, pp. 34 a 38", "puntos": ["Avalúo para garantía hipotecaria: lo pide el banco. Confirma la existencia de la garantía, su uso y sus condiciones de riesgo y rentabilidad.", "Avalúo para efectos fiscales: sirve de base gravable del ISAI en las entidades que lo exigen, y puede requerirse para IVA o ISR.", "Marco normativo: lo rigen las leyes y lineamientos de cada entidad. En la CDMX, el más representativo es el Manual de Procedimientos y Lineamientos Técnicos de Valuación Inmobiliaria de la Secretaría de Finanzas.", "Quién puede valuar: valuadores con registro vigente ante las autoridades locales. Para efectos fiscales federales, personas autorizadas por el artículo 4° del Reglamento del CFF, como valuadores profesionales con cédula de posgrado en valuación.", "Si el propietario o el asesor no están conformes con el avalúo, pueden pedir revisión o reconsideración. La opinión de la unidad valuadora debe ser imparcial, objetiva y fundamentada en el mercado."], "id": 14}, {"titulo": "Cobranza, riesgo y factores de la línea de crédito", "fuente": "Guía de estudio, pp. 48 a 53", "puntos": ["Cobranza: el atraso afecta el historial de crédito y puede generar gastos de cobranza e intereses moratorios. Si no hay acuerdo, a partir del quinto mes vencido se integra el expediente para demanda, y la cobranza sigue hasta el remate.", "Comisión por gastos de cobranza: porcentaje que la institución cobra sobre el saldo vencido en caso de incumplimiento.", "Riesgo: posibilidad de que no se recupere el crédito. La confianza mide la solvencia moral y económica del acreditado.", "LTV: monto del préstamo entre valor de la vivienda. Un LTV bajo implica menor riesgo para quien presta y mejores ofertas.", "PTI: el pago de la mensualidad se compara con el ingreso que el cliente debe comprobar según el factor del banco. Ejemplo de la guía: con un factor de 3 a 1 y una mensualidad de $2,500, el ingreso comprobable mínimo es de $7,500.", "Crédito puente: financia la edificación. Al individualizar las viviendas, cada propietario liquida su parte. El valor de liberación no puede ser menor al crédito de edificación de esa vivienda."], "id": 15}, {"titulo": "Simulador, condiciones finales y firma del crédito", "fuente": "Guía de estudio, pp. 11 a 21", "puntos": ["Simulador: calcula las condiciones con la tasa, el plazo y los gastos iniciales (comisión de apertura, investigación, avalúo y gastos notariales).", "Propuesta escrita al interesado: monto del crédito, destino, enganche, ingreso mínimo requerido, plazo, costo del seguro y pago mensual con su composición (capital, intereses y accesorios).", "Condiciones finales: las emite la institución financiera. En INFONAVIT y FOVISSSTE se emiten en la carta de instrucción notarial.", "Documentos para la firma: identificación del comprador, estado de cuenta de la cuenta aperturada, avisos de retención (INFONAVIT) o carta laboral y talón de pago (FOVISSSTE), y comprobantes de los anticipos al vendedor. Solo una porción del precio puede pagarse en efectivo.", "Elementos de control: el formato “Conoce a tu cliente” se llena de manera física al ofrecer el servicio. Los documentos se cotejan contra el original, y la copia lleva leyenda, sello y firma de fidelidad."], "id": 16}, {"titulo": "Productos, seguros y beneficios", "fuente": "Guía de estudio, pp. 22 a 27", "puntos": ["Destinos del crédito: vivienda, preventa, adquisición y liquidez, terreno y construcción.", "Seguro de vida e invalidez total y permanente: liquida el saldo del crédito si el titular fallece o queda inválido. La prima se calcula con el importe original, y el cliente puede elegir la aseguradora.", "Seguro de daños: cubre incendio, explosión, sismo, huracán u otros daños al inmueble, y puede incluir los contenidos de la vivienda.", "Seguro de Crédito a la Vivienda (SCV): cubre el no pago y permite ofrecer enganches más bajos. Lo ofrecen SHF y Genworth.", "Deducibilidad: los intereses reales (nominales menos inflación) pueden deducirse en la declaración anual, hasta por 30 años. La institución emite la constancia anual en febrero."], "id": 17}, {"titulo": "Contratos y obligaciones", "fuente": "Guía de estudio, pp. 64 a 73", "puntos": ["Compraventa: el vendedor se obliga a transferir la propiedad y el comprador a pagar el precio.", "Contrato de mutuo: el mutuante transfiere la propiedad de una suma de dinero y el mutuario se obliga a devolverla en las condiciones pactadas.", "Contrato de hipoteca: el deudor concede al acreedor el derecho de disponer del bien para garantizar una obligación, sin entregar la posesión.", "Obligaciones solidarias: en la activa, cada acreedor puede exigir el total. En la pasiva, cada deudor debe pagar la totalidad al acreedor.", "Fideicomiso: tres partes. El fideicomitente aporta los bienes, el fideicomisario recibe los beneficios y el fiduciario realiza los fines del contrato y verifica su cumplimiento."], "id": 18}, {"titulo": "Impuestos, prevención de lavado de dinero y KYC", "fuente": "Guía de estudio, pp. 60 a 84", "puntos": ["Impuestos en operaciones traslativas de dominio: los federales gravan la enajenación y, en algunos casos, la adquisición. Los locales gravan la adquisición, como el ISAI.", "ISR por enajenación de persona física: se paga en la escritura, salvo la exención de casa habitación, que aplica una vez cada 3 años y para precios de hasta 700,000 UDIS.", "ISR por adquisición: lo paga el comprador si el avalúo excede el precio en más de 10%. Se calcula con 20% sobre la diferencia total entre precio y avalúo.", "Fedatarios: deben identificar la forma de pago en las operaciones iguales o superiores a 8,025 veces el salario mínimo de la CDMX.", "KYC: identificar al cliente con credenciales u otra documentación oficial, pedir información sobre su actividad u ocupación, preguntar si conoce al dueño beneficiario y conservar la documentación."], "id": 19}], "notas": ["Algunos subtemas quedaron resumidos: IVA en operaciones inmobiliarias, sistemas registrales por entidad y los detalles de los avisos de privacidad.", "Nota de revisión: el art. Vigésimo Tercero, fracción IV, remite al art. Décimo Séptimo para la permanencia de adscripción, pero esos plazos están en el art. Décimo Segundo. Conviene confirmarlo con la Asociación.", "La Guía de estudio cita el Reglamento versión 2.0; esta guía usa la versión 7.0 (mayo 2026). Si tu temario usa otra versión, ajusta las respuestas."], "examen": [{"b": 1, "p": "¿Cuál es la referencia habitual para la edad del cliente más el plazo del crédito?", "o": ["74 años con 11 meses", "60 años con 11 meses", "84 años con 11 meses", "70 años con 11 meses"], "c": 0, "e": "Es la referencia general; algunas instituciones llegan a 84 años con 11 meses.", "ref": "Guía, originación"}, {"b": 1, "p": "El aforo o LTV se calcula sobre:", "o": ["El precio pactado en la compraventa", "El salario del acreditado", "El mayor entre el avalúo comercial y el precio pactado", "El menor entre el avalúo comercial y el precio pactado"], "c": 3, "e": "Se toma el valor menor de los dos.", "ref": "Guía, originación"}, {"b": 1, "p": "¿Qué es el enganche?", "o": ["La diferencia entre el crédito y el valor del inmueble, que paga el cliente", "La comisión por apertura", "El monto del crédito otorgado por el banco", "El saldo insoluto del mes"], "c": 0, "e": "El cliente lo liquida antes, durante o al final de la compra.", "ref": "Guía, originación"}, {"b": 1, "p": "El interés de cada mensualidad se calcula sobre:", "o": ["El monto original del crédito", "El valor del avalúo", "El saldo insoluto", "El ingreso del acreditado"], "c": 2, "e": "El saldo insoluto es la deuda real que queda después de cada pago de capital.", "ref": "Guía, finanzas básicas"}, {"b": 2, "p": "Un crédito ONAVIS se determina con base en:", "o": ["La edad y la escolaridad del trabajador", "Únicamente el buró de crédito", "El valor de la vivienda", "El salario y el plazo del crédito"], "c": 3, "e": "Su fuente de pago es la aportación patronal y un descuento en nómina.", "ref": "Guía, cofinanciamiento"}, {"b": 2, "p": "¿Qué es el saldo de la subcuenta de vivienda?", "o": ["Un préstamo de la banca al trabajador", "El ahorro acumulado para vivienda, que se entrega a la firma del crédito", "Una comisión por apertura", "Un seguro de crédito"], "c": 1, "e": "Se forma con aportaciones patronales del 5% del salario.", "ref": "Guía, cofinanciamiento"}, {"b": 2, "p": "En un cofinanciamiento, el crédito bancario se determina con base en:", "o": ["El número de dependientes económicos", "Solo la aportación patronal", "La capacidad de pago del cliente y su comportamiento en el buró", "El avalúo catastral"], "c": 2, "e": "La institución financiera lo define con esos dos factores.", "ref": "Guía, cofinanciamiento"}, {"b": 2, "p": "Los recursos disponibles para la compraventa son:", "o": ["La subcuenta más los créditos cofinanciados, menos los descuentos aplicables", "Solo el crédito bancario", "El enganche más el ISAI", "El valor del avalúo"], "c": 0, "e": "Suma la subcuenta y los créditos cofinanciados, y resta los descuentos.", "ref": "Guía, cofinanciamiento"}, {"b": 3, "p": "Según la guía, ¿qué porcentaje del ingreso neto mensual es el límite de endeudamiento de referencia?", "o": ["Entre 10% y 15%", "Entre 35% y 40%", "Entre 50% y 60%", "Hasta 100%"], "c": 1, "e": "Los expertos ubican ese límite entre 35% y 40%.", "ref": "Guía, nivel de endeudamiento (DTI)"}, {"b": 3, "p": "Cuando hay coacreditado, el DTI se calcula:", "o": ["Solo con el ingreso del acreditado", "Por separado, y después se promedian", "Sin incluir la mensualidad solicitada", "De manera conjunta"], "c": 3, "e": "El acreditado y el coacreditado se evalúan juntos.", "ref": "Guía, DTI"}, {"b": 3, "p": "¿Para qué sirve el buró de crédito en el proceso hipotecario?", "o": ["Para registrar la escritura en el Registro Público", "Para calcular el ISAI", "Para evaluar la certidumbre del cliente con base en su historial de pagos", "Para elegir al notario"], "c": 2, "e": "Las entidades financieras reportan si el cliente paga puntual o con retraso.", "ref": "Guía, buró de crédito"}, {"b": 3, "p": "¿Quién elabora el avalúo que valida el banco?", "o": ["Un experto calificado y certificado por la SHF", "El notario público", "El asesor hipotecario", "El vendedor del inmueble"], "c": 0, "e": "Opina sobre el valor comercial y la vida útil remanente.", "ref": "Guía, avalúos"}, {"b": 4, "p": "El ISAI es:", "o": ["Un impuesto federal que se paga al SAT", "La comisión por apertura del banco", "Un impuesto local que varía según la localidad y se paga en el traslado de dominio", "Un seguro de vida del acreditado"], "c": 2, "e": "Es el costo mayor del traslado de dominio, y su monto depende de la localidad.", "ref": "Guía, trámites e impuestos"}, {"b": 4, "p": "¿Qué órgano regula la Circular Única de Bancos, según la guía?", "o": ["La SHCP", "El INFONAVIT", "La SHF", "La CNBV"], "c": 3, "e": "La CNBV la regula junto con la Ley de Instituciones de Crédito.", "ref": "Guía, marco normativo"}, {"b": 4, "p": "En prevención de lavado de dinero y KYC, además del cliente, hay que identificar al:", "o": ["Notario", "Beneficiario controlador", "Valuador", "Vendedor"], "c": 1, "e": "Los expedientes de identificación deben estar disponibles para la UIF o el SAT.", "ref": "Guía, PLD y KYC"}, {"b": 4, "p": "Los datos financieros y patrimoniales del usuario requieren:", "o": ["Consentimiento expreso de su titular", "Un aviso en la notaría", "Consentimiento tácito", "Ninguna autorización"], "c": 0, "e": "Lo exige la LFPDPPP y lo retoma el Reglamento en su art. Segundo.", "ref": "Guía, protección de datos; Reglamento, art. Segundo"}, {"b": 5, "p": "Según el Reglamento, ¿cuándo una persona moral es Socio?", "o": ["Con 2 contratos directos y $500,000,000 de colocación", "Con 15 carátulas comodín", "Con 6 contratos directos con bancos, $1,800,000,000 en 12 meses y aprobación del consejo", "Con 85% de asesores certificados"], "c": 2, "e": "Los Asociados requieren 2 contratos y $500,000,000; los Socios, 6 contratos y $1,800,000,000.", "ref": "Reglamento, definiciones"}, {"b": 5, "p": "Art. Tercero: el intermediario debe informar al usuario:", "o": ["Solo la opción con mayor comisión", "Solo la tasa de interés", "Nada, porque la información es confidencial", "Todas las opciones crediticias, con beneficios, costos y riesgos"], "c": 3, "e": "Así el usuario decide con información suficiente.", "ref": "Reglamento, art. Tercero"}, {"b": 5, "p": "Art. Sexto: alterar de forma ilícita, dolosa y premeditada la información del usuario para manipular el resultado del crédito es:", "o": ["Una violación mayor al reglamento", "Una falta leve", "Una queja improcedente", "Un error administrativo"], "c": 0, "e": "Además, puede haber penalidades conforme a la legislación aplicable.", "ref": "Reglamento, art. Sexto"}, {"b": 5, "p": "Art. Séptimo prohíbe la colusión con:", "o": ["La Dirección General de la Sociedad", "El Comité de Cumplimiento", "Desarrolladores, inmobiliarias, valuadores u otros intermediarios", "El Oficial de Cumplimiento"], "c": 2, "e": "La colusión que genere distorsión de mercado está prohibida.", "ref": "Reglamento, art. Séptimo"}, {"b": 6, "p": "Art. Décimo Primero: un Master Bróker solo puede tener en su estructura a:", "o": ["Cualquier persona interesada", "Oficinas, franquicias, brókers o asesores certificados o en proceso de certificación", "Solo asesores con más de diez años de experiencia", "Asesores independientes sin aval de la Sociedad"], "c": 1, "e": "La certificación implica el aval de la Sociedad sobre la probidad ética y profesional.", "ref": "Reglamento, art. Décimo Primero"}, {"b": 6, "p": "Un intermediario certificado que no es de recién ingreso puede cambiar de Master Bróker cada:", "o": ["3 meses", "12 meses", "6 meses", "5 días hábiles"], "c": 2, "e": "Los de recién ingreso esperan 12 meses desde su primera certificación.", "ref": "Reglamento, art. Décimo Segundo"}, {"b": 6, "p": "Art. Décimo Octavo: la certificación tiene una vigencia de:", "o": ["Un año", "Tres años", "Sin vencimiento", "Dos años"], "c": 3, "e": "Debe renovarse antes del vencimiento mediante los exámenes respectivos.", "ref": "Reglamento, art. Décimo Octavo"}, {"b": 6, "p": "Según la tabla de sanciones, la falsificación o alteración de documentos se sanciona con:", "o": ["Pérdida definitiva de la certificación", "Suspensión de 60 días para generar carátulas", "Devolución de la comisión", "Suspensión de operaciones de la oficina por 30 días"], "c": 0, "e": "Es la primera conducta del catálogo del art. Vigésimo Octavo.", "ref": "Reglamento, arts. Vigésimo Octavo y Trigésimo"}, {"b": 6, "p": "Art. Vigésimo: la cuota de certificación:", "o": ["La paga la Sociedad", "Se reembolsa si el asesor no asiste a la cita", "La paga el solicitante", "La fija cada Master Bróker"], "c": 2, "e": "No es reembolsable si el asesor deja de asistir sin causa justificada.", "ref": "Reglamento, art. Vigésimo"}, {"b": 7, "p": "Un asesor que falsifica un documento del expediente recibe:", "o": ["60 días de bloqueo para generar carátulas", "Pérdida definitiva de la certificación", "Impago de la comisión", "Suspensión de la oficina por 30 días"], "c": 1, "e": "Es la primera conducta de la tabla.", "ref": "Reglamento, tabla de sanciones"}, {"b": 7, "p": "Un asesor que no verificó documentos en 2 expedientes recibe, como mínimo:", "o": ["12 meses de suspensión", "24 meses de suspensión", "Pérdida definitiva", "60 días de bloqueo"], "c": 1, "e": "1 expediente: 12 meses; 2 expedientes: 24 meses; 3 o más: pérdida definitiva.", "ref": "Reglamento, tabla, fila 2"}, {"b": 7, "p": "La primera vez que se usa firma no autógrafa del usuario, la sanción es:", "o": ["Pérdida definitiva", "60 días de bloqueo para generar carátulas", "Devolución de la comisión", "Impago de la comisión"], "c": 1, "e": "En reincidencia, la sanción pasa a pérdida definitiva.", "ref": "Reglamento, tabla, fila 7b"}, {"b": 7, "p": "Una oficina con inconsistencias generalizadas por primera vez se sanciona con:", "o": ["Pérdida definitiva de todos los asesores", "Suspensión de operaciones por 30 días", "Suspensión definitiva de la oficina", "Solo una amonestación"], "c": 1, "e": "En reincidencia, la suspensión de la oficina pasa a definitiva.", "ref": "Reglamento, tabla, fila 17"}, {"b": 7, "p": "¿Cuándo hay inconsistencia generalizada en una oficina?", "o": ["Con una queja presentada", "Con colusión o repetición de modus operandi con tres o más malas prácticas, o una misma más de dos veces en 18 meses", "Con más de 15 carátulas", "Cuando el Master Bróker tiene menos de 85% certificados"], "c": 1, "e": "Así lo define el Reglamento.", "ref": "Reglamento, tabla de sanciones"}, {"b": 7, "p": "Un asesor con pérdida definitiva de la certificación:", "o": ["Puede trabajar como empleado de oficina dentro de la misma estructura", "Puede trabajar en cualquier puesto, salvo en oficinas y franquicias", "No puede trabajar en ningún puesto de la estructura del Master Bróker, incluidas oficinas y franquicias", "Solo puede trabajar en otro Master Bróker"], "c": 2, "e": "Queda impedido en cualquier puesto de la estructura.", "ref": "Reglamento, tabla de sanciones"}, {"b": 8, "p": "En el caso de Ana, con un aforo de 80%, el monto máximo del crédito es:", "o": ["$1,920,000", "$1,760,000", "$2,400,000", "$1,600,000"], "c": 1, "e": "80% de $2,200,000, que es el menor de los dos valores.", "ref": "Caso práctico, tarea 1"}, {"b": 8, "p": "En el caso de Ana, el DTI es aproximadamente:", "o": ["27%", "37.7%", "45%", "8.3%"], "c": 1, "e": "($5,000 más $17,600) entre $60,000 = 37.7%, dentro del rango de 35% a 40%.", "ref": "Caso práctico, tarea 3"}, {"b": 9, "p": "Un Master Bróker que da de baja unilateralmente a un intermediario debe avisar a la Sociedad en:", "o": ["5 días hábiles", "5 días naturales", "15 días", "30 días"], "c": 1, "e": "El cambio de Master Bróker solicitado por el intermediario es en 5 días hábiles; la baja del MB, en 5 días naturales.", "ref": "Reglamento, art. Décimo Quinto Bis"}, {"b": 9, "p": "En los procedimientos de queja, los plazos se cuentan en:", "o": ["Días naturales", "Días hábiles", "Meses", "Horas"], "c": 1, "e": "Se excluyen sábados, domingos, días de descanso de la Ley Federal del Trabajo y días sin labores.", "ref": "Reglamento, art. Trigésimo Tercero"}, {"b": 9, "p": "Si un intermediario recibe información confidencial sin autorización expresa del titular, debe:", "o": ["Copiarla para su archivo", "Enviarla a su Master Bróker", "Borrarla", "Entregarla a la notaría"], "c": 2, "e": "Sin autorización expresa, debe borrar la información recibida.", "ref": "Reglamento, art. Quincuagésimo Séptimo"}, {"b": 9, "p": "Para pedir la restitución de la certificación de un asesor sancionado, debe haber transcurrido:", "o": ["Seis meses", "Un año desde la resolución", "Dos años", "Tres meses"], "c": 1, "e": "Solo se permite una solicitud al año, y la decide la Junta de Socios.", "ref": "Reglamento, art. Quin o que costaría sustituir el bien.", "ref": "Guía, enfoques de valuación"}, {"b": 12, "p": "El método del ingreso (capitalización) estima el valor como:", "o": ["El costo de reponer el bien", "El precio pactado en la compraventa", "El valor presente de los ingresos y beneficios futuros", "El salario del acreditado"], "c": 2, "e": "Es el valor presente de la productividad del bien durante su vida útil.", "ref": "Guía, enfoques de valuación"}, {"b": 13, "p": "¿Qué documento muestra si el inmueble tiene gravámenes?", "o": ["Boleta predial", "Constancia de no adeudo", "Certificado de libertad de gravamen (CLG)", "Aviso de terminación de obra"], "c": 2, "e": "Lo emite el Registro Público de la Propiedad.", "ref": "Guía, trámites notariales"}, {"b": 13, "p": "Al firmarse la escritura, el notario debe, entre otras cosas:", "o": ["Cancelar el avalúo", "Entregar el crédito al vendedor", "Presentar el aviso preventivo al Registro Público y pagar los impuestos locales de adquisición", "Eliminar el aviso de PLD"], "c": 2, "e": "También informa a la autoridad fiscal federal.", "ref": "Guía, trámites notariales"}, {"b": 13, "p": "¿Qué confirma el banco para validar el avalúo?", "o": ["Una carta del vendedor", "El certificado de no adeudo", "Un Vo.Bo. con sellos del banco", "La firma del notario en el avalúo"], "c": 2, "e": "Es la confirmación del avalúo que emite el banco.", "ref": "Guía, expediente del inmueble"}, {"b": 14, "p": "¿Qué avalúo sirve de base gravable para el ISAI en las entidades que lo exigen?", "o": ["El avalúo para garantía hipotecaria", "El avalúo para efectos fiscales", "El avalúo del vendedor", "El avalúo de un perito privado"], "c": 1, "e": "Así lo indica la guía.", "ref": "Guía, tipos de avalúo"}, {"b": 14, "p": "¿Qué norma rige el avalúo en la Ciudad de México, según la guía?", "o": ["La Ley Federal del Trabajo", "El Manual de Procedimientos y Lineamientos Técnicos de Valuación Inmobiliaria de la Secretaría de Finanzas", "El Código Penal", "La Ley del ISR"] X", "100 veces el salario mínimo"], "c": 2, "e": "Es una obligación de prevención de lavado de dinero.", "ref": "Guía, PLD y KYC"}, {"b": 19, "p": "Para el ISR por adquisición, ¿cuándo lo paga el comprador?", "o": ["Cuando el avalúo excede el precio en más de 10%", "Siempre", "Solo si el vendedor es persona moral", "Nunca"], "c": 0, "e": "Se calcula con 20% sobre la diferencia total entre precio y avalúo.", "ref": "Guía, impuestos federales"}]};
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NB=D.bloques.length, NE=D.examen.length;
let vista=0, resp={}, fin=false;

function pintarNav(){
  $("nav").innerHTML=D.bloques.map((b,i)=>`<button role="tab" data-go="${i}" aria-selected="${vista===i}">Bloque ${b.id}</button>`).join("")
    +`<button role="tab" data-go="${NB}" aria-selected="${vista===NB}">Examen</button>`;
}
function verBloque(){
  const b=D.bloques[vista];
  let h=`<h2>${esc(b.titulo)}</h2><p class="ref">${esc(b.fuente)}</p><ol class="pts">${b.puntos.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>`;
  if(b.solucion) h+=`<details class="det"><summary>Ver solución</summary><ol class="pts">${b.solucion.map(p=>`<li>${esc(p)}</li>`).join("")}</ol></details>`;
  if(vista===NB-1) h+=D.notas.map(n=>`<p class="note">${esc(n)}</p>`).join("");
  h+=`<div class="acc">${vista>0?`<button class="btn line" data-go="${vista-1}">Anterior</button>`:""}`
    +`<button class="btn" data-go="${vista+1}">${vista<NB-1?"Siguiente":"Ir al examen"}</button></div>`;
  return h;
}
function verExamen(){
  let h=`<h2>Examen de prueba</h2><p class="ref">${NE} preguntas de todos los bloques. Las respuestas incorrectas se marcan solo al terminar.</p><p class="det">${esc(D.criterios)}</p>`;
  h+=D.examen.map((q,i)=>`<div class="q"><h3>${i+1}. ${esc(q.p)}</h3>${q.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"${resp[i]===j?" checked":""}>${esc(o)}</label>`).join("")}</div>`).join("");
  h+=`<p class="det" id="prog">Respondidas: ${Object.keys(resp).length} de ${NE}</p><div class="acc"><button class="btn" data-act="terminar">Terminar examen</button></div>`;
  return h;
}
function verResultados(){
  const pb=D.bloques.map(()=>[0,0]);
  let ok=0;
  D.examen.forEach((q,i)=>{const acierto=resp[i]===q.c; pb[q.b-1][1]++; if(acierto){ok++; pb[q.b-1][0]++;}});
  let h=`<h2>Resultado</h2><p class="score">${ok} de ${NE} (${Math.round(ok/NE*100)}%)</p>`
    +`<ul>${D.bloques.map((b,i)=>`<li>Bloque ${b.id}: ${pb[i][0]} de ${pb[i][1]}</li>`).join("")}</ul>`;
  h+=D.examen.map((q,i)=>{
    const r=resp[i], a=r===q.c;
    return `<div class="q ${a?"ok-q":"ko-q"}"><p class="${a?"ok-t":"ko-t"}">${a?"Correcta":(r===undefined?"Sin responder":"Incorrecta")}</p>`
      +`<h3>${i+1}. ${esc(q.p)}</h3><p class="det">Tu respuesta: ${r===undefined?"no contestada":esc(q.o[r])}</p>`
      +`<p class="det">Respuesta correcta: <strong>${esc(q.o[q.c])}</strong></p><p class="det">${esc(q.e)} (${esc(q.ref)})</p></div>`;
  }).join("");
  h+=`<div class="acc"><button class="btn line" data-act="reiniciar">Reiniciar examen</button></div>`;
  return h;
}
function pintar(){
  pintarNav();
  $("v").innerHTML = vista<NB ? verBloque() : (fin ? verResultados() : verExamen());
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){ vista=+g.dataset.go; pintar(); return; }
  const a=e.target.closest("[data-act]");
  if(!a) return;
  if(a.dataset.act==="terminar"){ fin=true; vista=NB; pintar(); }
  if(a.dataset.act==="reiniciar"){ resp={}; fin=false; vista=NB; pintar(); }
});
document.addEventListener("change",e=>{
  if(e.target.type!=="radio") return;
  resp[+e.target.name.slice(1)]=+e.target.value;
  const p=$("prog"); if(p) p.textContent=`Respondidas: ${Object.keys(resp).length} de ${NE}`;
});
$("t").textContent=D.titulo;
$("s").textContent=D.subtitulo;
pintar();
</script></body></html>
